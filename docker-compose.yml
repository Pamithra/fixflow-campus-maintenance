services:
  postgres:
    image: postgres:16-alpine
    container_name: fixflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fixflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fixflow_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-fixflow_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixflow_user} -d ${DB_NAME:-fixflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fixflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: